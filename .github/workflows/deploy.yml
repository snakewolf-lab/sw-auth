name: Build and Push to Build Branch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. dev ブランチを取得
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      # 2. Node.js セットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. 依存関係インストール
      - name: Install dependencies
        run: npm ci

      # 4. 本番ビルド
      - name: Build assets
        run: npm run build

      # 5. デプロイ用ディレクトリ作成
      - name: Prepare deployment files
        run: |
          mkdir -p deploy

          # 必要なファイルをコピー
          cp -r public/. deploy/

          # 不要なファイルを除外
          rm -rf deploy/build/.git
          rm -rf deploy/build/node_modules

      # 6. build ブランチへデプロイ
      - name: Deploy to build branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.BUILD_REPO_PAT }}
          publish_branch: build
          publish_dir: ./deploy
          force_orphan: true
          commit_message: "build: production release (${{ github.sha }})"
